name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    environment: production

    steps:
      - name: Debug OIDC claims
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log('sub:', payload.sub);
            console.log('aud:', payload.aud);
            console.log('ref:', payload.ref);
            console.log('environment:', payload.environment);
            console.log('repository:', payload.repository);
            console.log('repository_id:', payload.repository_id);
            console.log('repository_owner_id:', payload.repository_owner_id);
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: brain-agriculture-deploy

      - name: Deploy to EC2 with SSM
        shell: bash
        run: |
          set -euo pipefail

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy brain-agriculture from GitHub Actions" \
            --parameters 'commands=[
              "set -e",
              "cd /opt/brain-agriculture",
              "echo Updating source code...",
              "sudo -u ubuntu git -C /opt/brain-agriculture fetch origin main",
              "sudo -u ubuntu git -C /opt/brain-agriculture reset --hard origin/main",
              "echo Building production containers...",
              "docker compose -f docker-compose.yaml -f docker-compose.prod.yaml build",
              "echo Starting infrastructure...",
              "docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d postgres prometheus loki tempo grafana otel-collector",
              "echo Running database migrations...",
              "docker compose -f docker-compose.yaml -f docker-compose.prod.yaml run --rm app npm run migration:run:prod",
              "echo Starting application...",
              "docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d app",
              "echo Removing orphan containers...",
              "docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d --remove-orphans",
              "echo Removing unused Docker images...",
              "docker image prune -f",
              "echo Deployment completed."
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"
          echo "Waiting for deployment to finish..."

          set +e
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"
          WAIT_EXIT_CODE=$?
          set -e

          echo "Deployment output:"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text || true

          echo "Deployment errors:"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "StandardErrorContent" \
            --output text || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          if [ "$WAIT_EXIT_CODE" -ne 0 ] || [ "$STATUS" != "Success" ]; then
            echo "Deployment failed."
            exit 1
          fi

          echo "Deployment completed successfully."
